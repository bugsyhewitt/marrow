[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marrow"
version = "0.1.0"
description = "Prototype pollution payload generator and static JavaScript vulnerability scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
marrow = "marrow.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
